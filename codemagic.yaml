workflows:
  ci-build:
    name: CI — analyze, test, build all platforms
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      java: 17
    cache:
      cache_paths:
        - ~/.pub-cache
        - ~/.gradle/caches
        - ~/Library/Caches/CocoaPods
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: '*'
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - name: Bootstrap workspace
        script: |
          dart pub global activate melos
          for i in 1 2 3; do
            melos bs && exit 0
            echo "melos bs failed (attempt $i/3), retrying..."
            sleep 5
          done
          exit 1
      - name: Format check
        script: dart format --output=none --set-exit-if-changed zenpay_dart zenpay_flutter zenpay_embedded example scripts cli.dart
      - name: Analyze (all packages)
        script: melos run analyze
      - name: Test (all packages)
        script: melos run test && melos run test:dart
      - name: Build Android (debug)
        script: |
          cd example/app
          flutter build apk --debug
      - name: Build iOS (debug, unsigned)
        script: |
          cd example/app
          flutter build ios --debug --no-codesign
      - name: Build Web (release)
        script: |
          cd example/app
          flutter build web --release
    artifacts:
      - example/app/build/app/outputs/flutter-apk/app-debug.apk
      - example/app/build/ios/iphoneos/*.app
      - example/app/build/web/**
