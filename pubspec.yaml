name: zp_flutter_sdk
publish_to: none

environment:
  sdk: ^3.12.0

# Required by melos 7+, which delegates package linking to Dart pub workspaces
# rather than doing it itself. Every entry must also declare
# `resolution: workspace` in its own pubspec.
workspace:
  - zenpay_dart
  - zenpay_flutter
  - example/app
  - example/backend

dev_dependencies:
  args: ^2.7.0
  melos: ^8.3.0
  test: ^1.31.0
  very_good_analysis: ^10.3.0

# Runs automatically on every `dart pub get` / `melos bs`: installs the
# lefthook git hooks (see lefthook.yml) so no machine commits without the gate.
# (The pub.dev `lefthook` wrapper is Dart-2-only and incompatible with Dart 3,
# so the npm-distributed binary is used via npx instead.)
scripts:
  prepare: npx --yes lefthook install

melos:
  packages:
    - zenpay_dart
    - zenpay_flutter
    - example/*
  scripts:
    test:
      exec: flutter test
      description: Run Flutter/Dart tests across all packages.
      packageFilters:
        dirExists: test
    format:
      exec: dart format .
      description: Format all Dart and Flutter code.
    analyze:
      exec: dart analyze .
      description: Run static analysis (dart analyze) across all packages.
    lint:
      exec: dart run dart_code_linter:metrics analyze lib
      description: Run unused code checks using dart_code_linter.
      packageFilters:
        dependsOn: "dart_code_linter"
    coverage:
      exec: flutter test --coverage
      description: Generate lcov coverage for Flutter packages.
      packageFilters:
        dirExists: test
        flutter: true
    coverage:dart:
      exec: dart run coverage:test_with_coverage && dart run coverage:format_coverage --packages="$MELOS_ROOT_PATH/.dart_tool/package_config.json" --lcov -i coverage/coverage.json -o coverage/lcov.info --base-directory . --check-ignore
      description: Generate lcov coverage for pure Dart packages.
      packageFilters:
        dirExists: test
        flutter: false
    server:
      exec: dart run bin/server.dart
      description: Run the example backend server.
      packageFilters:
        dirExists: bin
        scope: zenpay_example_backend
    android:
      exec: adb reverse tcp:7000 tcp:7000 && flutter run --dart-define-from-file=.env
      description: Run the example app on Android (with ADB reverse port forwarding).
      packageFilters:
        scope: zenpay_example_app
    web:
      exec: flutter run -d chrome --dart-define-from-file=.env --web-port=7001
      description: Run the example app on Web.
      packageFilters:
        scope: zenpay_example_app
