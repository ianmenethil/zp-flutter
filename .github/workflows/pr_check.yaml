name: PR Check

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # `dart run melos bootstrap` occasionally hits a transient
      # "Bad state: Attempting to send request on closed client" bug inside
      # package:pub's HTTP client while fetching versions from pub.dev — not
      # caused by anything in this repo. Retry a couple of times before
      # failing the job.
      - name: Resolve pub workspace
        run: |
          for i in 1 2 3; do
            dart run melos bootstrap && exit 0
            echo "melos bootstrap failed (attempt $i/3), retrying..."
            sleep 5
          done
          exit 1

      - name: Verify formatting
        run: dart run melos run format -- --set-exit-if-changed

      - name: Analyze
        run: dart run melos run analyze

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: zenpay_dart
            kind: dart
          - package: zenpay_flutter
            kind: flutter
          - package: zenpay_embedded
            kind: flutter
          - package: zenpay_example_backend
            kind: dart
          - package: zenpay_example_app
            kind: flutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # Every matrix job resolves the whole pub workspace, even for a
      # dart-only package: sibling members (zenpay_flutter, zenpay_embedded,
      # example/app) declare `flutter: sdk: flutter`, and workspace
      # resolution is monorepo-wide, not per-package.
      # `dart run melos bootstrap` occasionally hits a transient
      # "Bad state: Attempting to send request on closed client" bug inside
      # package:pub's HTTP client while fetching versions from pub.dev — not
      # caused by anything in this repo. Retry a couple of times before
      # failing the job.
      - name: Resolve pub workspace
        run: |
          for i in 1 2 3; do
            dart run melos bootstrap && exit 0
            echo "melos bootstrap failed (attempt $i/3), retrying..."
            sleep 5
          done
          exit 1

      - name: Test (flutter)
        if: matrix.kind == 'flutter'
        run: dart run melos run test --scope=${{ matrix.package }}

      - name: Test (dart)
        if: matrix.kind == 'dart'
        run: dart run melos run test:dart --scope=${{ matrix.package }}
