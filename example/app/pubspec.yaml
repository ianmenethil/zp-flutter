name: zenpay_example_app
description: Combined example Flutter app for the ZenPay Hosted Checkout SDK (zenpay_flutter).
publish_to: none
version: 0.1.0+1

resolution: workspace

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  # Resolves to the local workspace member (see the root pubspec's `workspace`
  # list); a path dep is rejected because the workspace already links it.
  # Once published, external consumers get the pub.dev version from this same
  # constraint — nothing here changes at release.
  recaptcha_enterprise_flutter: ^18.9.1
  zenpay_embedded: ^0.1.0
  zenpay_flutter: ^0.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/brand/logo.png
    - assets/brand/logo-light.png
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-Black.ttf
          weight: 900
    # Bundled so widgets that fall back to Material's default family don't
    # fetch Roboto from fonts.gstatic.com on web (engine fonts, same TTFs
    # Flutter itself ships).
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
