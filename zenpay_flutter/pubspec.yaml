name: zenpay_flutter
description: Secure Flutter orchestration for ZenPay Hosted Checkout sessions.
version: 0.1.0
homepage: https://www.zenithpayments.com.au
repository: https://github.com/ianmenethil/zp-flutter/tree/master/zenpay_flutter

resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.44.0"

dependencies:
  app_links: ^7.2.1
  collection: ^1.19.0
  flutter:
    sdk: flutter
  meta: ^1.18.0
  url_launcher: ^6.3.2

dev_dependencies:
  dart_code_linter: ^4.1.9
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  # Both are transitive dependencies of url_launcher, declared here only so
  # tests may fake UrlLauncherPlatform.instance. Neither ships to consumers.
  plugin_platform_interface: ^2.1.8
  url_launcher_platform_interface: ^2.3.2
