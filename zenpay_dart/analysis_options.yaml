# Points straight at package:lints (declared in this package's own
# dev_dependencies below) rather than ../analysis_options.yaml, which only
# resolves inside this monorepo's shared pub workspace — an extracted,
# standalone copy of this package has no `../` to find. The strictness flags
# and rules restated below mirror the root analysis_options.yaml's own
# local overrides.
include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

formatter:
  page_width: 160

linter:
  rules:
    # Dart's primary-constructor syntax (used by the model classes in
    # lib/src/models/) gives a class no separate line a constructor doc can
    # attach to, so this lint can't be satisfied for them. Off package-wide
    # since the rule has no per-construct granularity; every exported public
    # member still carries a doc comment by convention, just unenforced by
    # the linter.
    public_member_api_docs: false
